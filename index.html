
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>COBRA STORE | Premium Shopping</title>

<style>
:root{
  --gold:#d6ad55;
  --gold2:#f5d98b;
  --black:#080808;
  --card:#151515;
  --white:#f8f5ed;
  --green:#174d35;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--black);
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
}
button,input,select{font:inherit}
button{cursor:pointer}

/* INTRO VIDEO */
#intro{
  position:fixed;
  inset:0;
  z-index:9999;
  background:#000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  transition:opacity .8s ease;
}
#cobraVideo{
  width:100%;
  height:calc(100% - 42px);
  object-fit:contain;
  background:#000;
}

/* Corner branding animation */
.cornerBrand{
  position:absolute;
  top:18px;
  left:12px;
  z-index:3;
  color:var(--gold2);
  font-weight:900;
  letter-spacing:2px;
  font-size:clamp(12px,3vw,19px);
  text-shadow:0 0 12px #b88731;
  pointer-events:none;
  animation:cornerAppear 5s ease-in-out infinite;
}
@keyframes cornerAppear{
  0%{opacity:0;transform:translateX(-55px) scale(.8)}
  15%{opacity:1;transform:translateX(0) scale(1)}
  72%{opacity:1;transform:translateX(0) scale(1)}
  90%{opacity:0;transform:translateX(-55px) scale(.8)}
  100%{opacity:0;transform:translateX(-55px) scale(.8)}
}

/* Skip button only */
#skip{
  position:absolute;
  top:17px;
  right:14px;
  z-index:5;
  border:1px solid var(--gold);
  background:rgba(0,0,0,.55);
  color:var(--gold2);
  padding:9px 15px;
  border-radius:30px;
  font-size:11px;
  font-weight:bold;
  letter-spacing:1px;
  backdrop-filter:blur(5px);
}
#skip:hover{background:var(--gold);color:#000}

/* Intro footer - separate from video */
.introCredits{
  width:100%;
  height:42px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:4px 8px;
  background:#050505;
  color:#bda66f;
  font-size:clamp(8px,2.2vw,11px);
  letter-spacing:1px;
  text-align:center;
  white-space:nowrap;
}
.introCredits .cobraMark{color:var(--gold2);font-size:14px}
.introCredits .creditName{color:#f1d28a;font-weight:bold}

/* STORE HEADER */
#store{display:none;min-height:100vh}
header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(7,7,7,.97);
  border-bottom:1px solid #57431e;
  padding:13px 15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
.brand{
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--gold2);
  font-size:22px;
  font-weight:900;
  letter-spacing:1px;
}
.brandIcon{
  width:39px;height:39px;
  border:1px solid var(--gold);
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:23px;
  background:#17120a;
}
.headerActions{display:flex;gap:8px}
.headerBtn{
  border:1px solid var(--gold);
  background:transparent;
  color:var(--gold2);
  padding:9px 12px;
  border-radius:8px;
  font-weight:bold;
  font-size:12px;
}
.headerBtn:hover{background:var(--gold);color:#000}

/* HERO */
.hero{
  text-align:center;
  padding:38px 15px 30px;
  background:
    radial-gradient(ellipse at center,#29200f 0%,#0b0b0b 65%);
  border-bottom:1px solid #342816;
}
.hero h1{
  margin:0;
  color:var(--gold2);
  font-size:clamp(27px,6vw,48px);
  letter-spacing:3px;
  text-shadow:0 0 20px #6b4b17;
}
.hero p{
  color:#c8b98f;
  font-size:13px;
  letter-spacing:2px;
  margin:12px 0 0;
}

/* SEARCH AND FILTERS */
.controls{
  max-width:1100px;
  margin:20px auto;
  padding:0 14px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}
.controls input,.controls select{
  flex:1;
  min-width:150px;
  padding:12px;
  border:1px solid #66502a;
  border-radius:8px;
  background:#151515;
  color:white;
  outline:none;
}
.controls input:focus,.controls select:focus{
  border-color:var(--gold2);
}
.categories{
  max-width:1100px;
  margin:0 auto 20px;
  padding:0 14px;
  display:flex;
  gap:8px;
  overflow-x:auto;
}
.catBtn{
  flex-shrink:0;
  border:1px solid #59451f;
  background:#151515;
  color:#e6d6b2;
  border-radius:25px;
  padding:9px 15px;
  font-size:12px;
}
.catBtn.active,.catBtn:hover{
  background:var(--gold);
  color:#080808;
  border-color:var(--gold);
}

/* PRODUCTS */
.sectionTitle{
  max-width:1100px;
  margin:25px auto 15px;
  padding:0 14px;
  color:var(--gold2);
  font-size:20px;
}
.products{
  max-width:1100px;
  margin:0 auto;
  padding:0 14px 35px;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}
.product{
  background:linear-gradient(145deg,#1b1b1b,#101010);
  border:1px solid #40321b;
  border-radius:12px;
  overflow:hidden;
  transition:.25s;
}
.product:hover{
  transform:translateY(-4px);
  border-color:var(--gold);
  box-shadow:0 8px 25px #000;
}
.product img{
  display:block;
  width:100%;
  height:165px;
  object-fit:cover;
  background:#222;
}
.productInfo{padding:12px}
.productInfo h3{
  margin:0 0 8px;
  font-size:14px;
  color:#fff0ce;
}
.productInfo .category{
  color:#bda66f;
  font-size:10px;
}
.price{
  color:var(--gold2);
  font-size:17px;
  font-weight:bold;
  margin:9px 0;
}
.productButtons{display:flex;gap:7px}
.productButtons button{
  flex:1;
  border:1px solid var(--gold);
  border-radius:7px;
  padding:9px 5px;
  font-size:11px;
  font-weight:bold;
}
.viewBtn{background:transparent;color:var(--gold2)}
.addBtn{background:var(--gold);color:#080808}
.empty{
  grid-column:1/-1;
  text-align:center;
  color:#bca875;
  padding:35px 10px;
}

/* CART */
.cartPanel{
  max-width:1100px;
  margin:0 auto 30px;
  padding:15px;
  border:1px solid #5b4826;
  border-radius:12px;
  background:#111;
}
.cartPanel h2{color:var(--gold2);font-size:19px}
.cartItem{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid #292929;
  font-size:13px;
}
.removeBtn{
  background:#542323;
  border:0;
  color:white;
  border-radius:5px;
  padding:6px 9px;
}
.cartTotal{
  color:var(--gold2);
  font-weight:bold;
  margin:15px 0;
}
.checkout{
  width:100%;
  border:0;
  border-radius:8px;
  padding:13px;
  background:#167346;
  color:white;
  font-weight:bold;
}
.checkout:hover{background:#208c58}

/* PRODUCT MODAL */
#productModal{
  display:none;
  position:fixed;
  inset:0;
  z-index:500;
  background:rgba(0,0,0,.85);
  align-items:center;
  justify-content:center;
  padding:15px;
}
.modalBox{
  width:100%;
  max-width:420px;
  background:#151515;
  border:1px solid var(--gold);
  border-radius:14px;
  overflow:hidden;
  position:relative;
}
.modalBox img{
  width:100%;
  height:240px;
  object-fit:cover;
}
.modalContent{padding:16px}
.modalContent h2{color:var(--gold2)}
.modalContent p{color:#ddd;line-height:1.6;font-size:14px}
.closeModal{
  position:absolute;
  right:10px;top:10px;
  background:#000;
  color:white;
  border:1px solid var(--gold);
  border-radius:50%;
  width:34px;height:34px;
}

/* MAIN FOOTER */
footer{
  text-align:center;
  padding:23px 12px;
  border-top:1px solid #49391f;
  background:#070707;
  color:#bca875;
  font-size:11px;
  line-height:2;
  letter-spacing:1px;
}
footer strong{color:var(--gold2)}

/* RESPONSIVE */
@media(min-width:650px){
  .products{grid-template-columns:repeat(3,minmax(0,1fr))}
  .product img{height:210px}
}
@media(min-width:950px){
  .products{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media(max-width:380px){
  .brand{font-size:17px}
  .brandIcon{width:33px;height:33px}
  .headerBtn{padding:8px;font-size:10px}
  .product img{height:135px}
}
</style>
</head>

<body>

<!-- CINEMATIC INTRO -->
<section id="intro">

  <div class="cornerBrand">🐍 COBRA STORE</div>

  <button id="skip" onclick="openStore()">SKIP INTRO ✕</button>

  <video
    id="cobraVideo"
    autoplay
    muted
    playsinline
    preload="auto"
    src="YTShort_09Nov2026_19_11_21.mp4">
  </video>

  <div class="introCredits">
    <span>AS TOLD BY CHATGPT</span>
    <span class="cobraMark">🐍</span>
    <span class="creditName">COBRA STORE</span>
    <span>•</span>
    <span>WEBSITE BY THE COBRA DEVELOPERS</span>
  </div>

</section>

<!-- MAIN STORE -->
<div id="store">

  <header>
    <div class="brand">
      <div class="brandIcon">🐍</div>
      <span>COBRA STORE</span>
    </div>

    <div class="headerActions">
      <button class="headerBtn" onclick="goToCart()">
        🛒 CART (<span id="cartCount">0</span>)
      </button>
    </div>
  </header>

  <section class="hero">
    <h1>COBRA STORE</h1>
    <p>UNLEASH THE POWER OF SHOPPING</p>
  </section>

  <div class="controls">
    <input
      id="searchInput"
      type="search"
      placeholder="Search products..."
      oninput="renderProducts()">

    <select id="sortSelect" onchange="renderProducts()">
      <option value="default">Sort Products</option>
      <option value="low">Price: Low to High</option>
      <option value="high">Price: High to Low</option>
      <option value="name">Name: A to Z</option>
    </select>
  </div>

  <div class="categories" id="categories"></div>

  <h2 class="sectionTitle">✦ EXPLORE OUR COLLECTION ✦</h2>

  <main class="products" id="products"></main>

  <section class="cartPanel" id="cartSection">
    <h2>🛒 YOUR SHOPPING CART</h2>
    <div id="cartItems">
      <p style="color:#aaa;font-size:13px">Your cart is empty.</p>
    </div>
    <div class="cartTotal" id="cartTotal">Total: Rs. 0</div>
    <button class="checkout" onclick="checkoutWhatsApp()">
      ORDER ON WHATSAPP
    </button>
  </section>

  <footer>
    AS TOLD BY CHATGPT
    <br>
    <strong>🐍 COBRA STORE</strong>
    <br>
    WEBSITE BY <strong>THE COBRA DEVELOPERS</strong>
  </footer>

</div>

<!-- PRODUCT DETAILS -->
<div id="productModal" onclick="closeModalOutside(event)">
  <div class="modalBox">
    <button class="closeModal" onclick="closeModal()">✕</button>
    <img id="modalImage" src="" alt="Product">
    <div class="modalContent">
      <h2 id="modalName"></h2>
      <div class="price" id="modalPrice"></div>
      <p id="modalDescription"></p>
      <button class="checkout" id="modalAdd">ADD TO CART</button>
    </div>
  </div>
</div>

<script>
/* INTRO CONTROL */
const intro = document.getElementById("intro");
const video = document.getElementById("cobraVideo");
let introClosed = false;

function openStore(){
  if(introClosed) return;
  introClosed = true;
  intro.style.opacity = "0";

  setTimeout(()=>{
    intro.style.display = "none";
    document.getElementById("store").style.display = "block";
    window.scrollTo(0,0);
  },800);
}

/* When video finishes, open the store */
video.addEventListener("ended",openStore);

/* If video cannot load, allow the user to enter with Skip */
video.addEventListener("error",()=>{
  console.log("Intro video could not be loaded. Check the video filename.");
});

/* Try autoplay */
video.play().catch(()=>{
  console.log("Browser requires a user interaction to play the intro video.");
});

/* PRODUCT DATA
   These are demo products. Replace them with your real products and prices.
*/
const products = [
  {
    id:1,
    name:"Premium Men's Shoes",
    category:"Shoes",
    price:2499,
    image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=700",
    description:"Stylish everyday footwear with a modern premium look."
  },
  {
    id:2,
    name:"Luxury Wrist Watch",
    category:"Watches",
    price:1899,
    image:"https://images.unsplash.com/photo-1524592094714-0f0654e20314?w=700",
    description:"A classic watch style for everyday and special occasions."
  },
  {
    id:3,
    name:"Wireless Headphones",
    category:"Technology",
    price:2999,
    image:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=700",
    description:"Modern headphones for music, entertainment and daily use."
  },
  {
    id:4,
    name:"Premium Perfume",
    category:"Perfumes",
    price:1599,
    image:"https://images.unsplash.com/photo-1541643600914-78b084683601?w=700",
    description:"A stylish fragrance choice for your collection."
  },
  {
    id:5,
    name:"Fashion Backpack",
    category:"Bags",
    price:2199,
    image:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=700",
    description:"A practical bag with a clean and modern design."
  },
  {
    id:6,
    name:"Smart Mobile Phone",
    category:"Technology",
    price:24999,
    image:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=700",
    description:"A modern smartphone product showcase."
  },
  {
    id:7,
    name:"Casual Sneakers",
    category:"Shoes",
    price:2799,
    image:"https://images.unsplash.com/photo-1549298916-b41d501d3772?w=700",
    description:"Comfortable casual sneakers for everyday style."
  },
  {
    id:8,
    name:"Elegant Ladies Bag",
    category:"Bags",
    price:3299,
    image:"https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=700",
    description:"A fashionable bag for daily use and occasions."
  }
];

let selectedCategory = "All";
let cart = [];

const categories = [
  "All",
  "Shoes",
  "Watches",
  "Technology",
  "Perfumes",
  "Bags"
];

/* CATEGORY BUTTONS */
function renderCategories(){
  const area = document.getElementById("categories");

  area.innerHTML = categories.map(category=>`
    <button
      class="catBtn ${selectedCategory===category?"active":""}"
      onclick="selectCategory('${category}')">
      ${category}
    </button>
  `).join("");
}

function selectCategory(category){
  selectedCategory = category;
  renderCategories();
  renderProducts();
}

/* PRODUCT DISPLAY */
function renderProducts(){
  const search = document.getElementById("searchInput").value
    .toLowerCase().trim();

  const sort = document.getElementById("sortSelect").value;

  let list = products.filter(product=>{
    const matchesCategory =
      selectedCategory==="All" ||
      product.category===selectedCategory;

    const matchesSearch =
      product.name.toLowerCase().includes(search) ||
      product.category.toLowerCase().includes(search);

    return matchesCategory && matchesSearch;
  });

  if(sort==="low") list.sort((a,b)=>a.price-b.price);
  if(sort==="high") list.sort((a,b)=>b.price-a.price);
  if(sort==="name") list.sort((a,b)=>a.name.localeCompare(b.name));

  const area = document.getElementById("products");

  if(!list.length){
    area.innerHTML = `<div class="empty">No products found.</div>`;
    return;
  }

  area.innerHTML = list.map(product=>`
    <article class="product">
      <img
        src="${product.image}"
        alt="${product.name}"
        loading="lazy"
        onerror="this.src='https://placehold.co/600x400/171717/d6ad55?text=COBRA+STORE'">

      <div class="productInfo">
        <div class="category">${product.category}</div>
        <h3>${product.name}</h3>
        <div class="price">Rs. ${product.price.toLocaleString("en-PK")}</div>

        <div class="productButtons">
          <button class="viewBtn" onclick="showDetails(${product.id})">
            DETAILS
          </button>
          <button class="addBtn" onclick="addToCart(${product.id})">
            ADD +
          </button>
        </div>
      </div>
    </article>
  `).join("");
}

/* CART FUNCTIONS */
function addToCart(id){
  const product = products.find(item=>item.id===id);
  const existing = cart.find(item=>item.id===id);

  if(existing){
    existing.quantity++;
  }else{
    cart.push({...product,quantity:1});
  }

  renderCart();
}

function removeFromCart(id){
  cart = cart.filter(item=>item.id!==id);
  renderCart();
}

function renderCart(){
  const area = document.getElementById("cartItems");
  const count = cart.reduce((sum,item)=>sum+item.quantity,0);
  const total = cart.reduce(
    (sum,item)=>sum+(item.price*item.quantity),0
  );

  document.getElementById("cartCount").textContent = count;
  document.getElementById("cartTotal").textContent =
    "Total: Rs. " + total.toLocaleString("en-PK");

  if(cart.length===0){
    area.innerHTML =
      `<p style="color:#aaa;font-size:13px">Your cart is empty.</p>`;
    return;
  }

  area.innerHTML = cart.map(item=>`
    <div class="cartItem">
      <span>
        ${item.name} × ${item.quantity}
        <br>
        <small style="color:#c4a96b">
          Rs. ${(item.price*item.quantity).toLocaleString("en-PK")}
        </small>
      </span>
      <button class="removeBtn" onclick="removeFromCart(${item.id})">
        REMOVE
      </button>
    </div>
  `).join("");
}

function goToCart(){
  document.getElementById("cartSection").scrollIntoView({
    behavior:"smooth"
  });
}

/* WHATSAPP CHECKOUT */
function checkoutWhatsApp(){
  if(cart.length===0){
    alert("Please add a product to your cart first.");
    return;
  }

  const total = cart.reduce(
    (sum,item)=>sum+(item.price*item.quantity),0
  );

  let message = "Assalam-o-Alaikum! I want to order from COBRA STORE:%0A%0A";

  cart.forEach(item=>{
    message +=
      "• "+encodeURIComponent(item.name)+
      " x "+item.quantity+
      " — Rs. "+item.price*item.quantity+
      "%0A";
  });

  message +=
    "%0ATotal: Rs. "+total+
    "%0A%0AKindly share order details.";

  window.open(
    "https://wa.me/923432752543?text="+message,
    "_blank"
  );
}

/* PRODUCT DETAILS MODAL */
function showDetails(id){
  const product = products.find(item=>item.id===id);

  document.getElementById("modalImage").src = product.image;
  document.getElementById("modalName").textContent = product.name;
  document.getElementById("modalPrice").textContent =
    "Rs. "+product.price.toLocaleString("en-PK");
  document.getElementById("modalDescription").textContent =
    product.description;

  document.getElementById("modalAdd").onclick = ()=>{
    addToCart(id);
    closeModal();
  };

  document.getElementById("productModal").style.display = "flex";
}

function closeModal(){
  document.getElementById("productModal").style.display = "none";
}

function closeModalOutside(event){
  if(event.target.id==="productModal") closeModal();
}

/* INITIAL LOAD */
renderCategories();
renderProducts();
renderCart();
</script>

</body>
</html>
